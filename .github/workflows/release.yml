name: Release

# Push a tag like v1.6.0 to build the Windows exe + installer and the Android APK, and attach them to a GitHub Release.
# If the source repo is private, set the repository variable RELEASES_REPO (e.g. xurqxy/xurqxys-dbd-tool-releases)
# and the secret RELEASES_TOKEN, and releases go to that public repo instead (see docs/PROTECTION.md).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Obfuscate the app
        run: node scripts/protect.js
      - name: Build installer and portable exe
        # Code signing switches on automatically when the WIN_CSC_LINK secret is set (see docs/SIGNING.md).
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Build the mobile web app (obfuscated) and copy it into the Android project
        run: |
          node scripts/build-mobile.js
          npx cap sync android
      - name: Unpack the signing key
        # ANDROID_KEYSTORE_BASE64 etc. come from docs/MOBILE.md. Without them the APK is signed with a throwaway debug key.
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/XurqxysDBDTool-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: dist/*.apk

  publish:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the release description from CHANGELOG.md
        run: node scripts/release-notes.js > release-notes.md
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Xurqxys DBD Tool ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            dist/*.apk
            LICENSE.txt
            THIRD-PARTY-NOTICES.txt
          repository: ${{ vars.RELEASES_REPO || github.repository }}
          token: ${{ secrets.RELEASES_TOKEN || github.token }}
